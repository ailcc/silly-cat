# 打包发布：推送 v* 标签（例如 git tag v0.0.2 && git push origin v0.0.2）时，
# 在 macOS（universal：Intel + Apple Silicon 一个包）和 Windows（NSIS 安装包）上各自构建，
# 把安装包挂到同一个「草稿」Release 上，确认没问题后再到 GitHub 网页上手动发布。
#
# 写法参照 Tauri 2 官方文档 https://v2.tauri.app/distribute/pipelines/github/ 和
# https://github.com/tauri-apps/tauri-action （2026-11 查阅：tauri-action@v1、checkout@v7、setup-node@v6）。
# 手动运行只生成 workflow artifacts。macOS 有证书时固定签名，首次打开仍需在「隐私与安全性」放行。
name: release
run-name: 编译安装包 ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: macOS 签名方式（tauri 默认，script 用于自签证书导入失败时）
        type: choice
        default: tauri
        options:
          - tauri
          - script

jobs:
  build:
    permissions:
      contents: write # 创建 Release、上传安装包
    env:
      HAS_UPDATE_KEYS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
      MACOS_HAS_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.MACOS_SIGNING_CERT_P12_BASE64 != '' }}
      MACOS_HAS_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.MACOS_SIGNING_CERT_PASSWORD != '' }}
      MACOS_SIGNING_CERT_SHA1: ${{ matrix.platform == 'macos-latest' && vars.MACOS_SIGNING_CERT_SHA1 || '' }}
    strategy:
      # 两个 runner 依次创建/更新同一草稿和 latest.json，避免同时读写时覆盖平台条目。
      max-parallel: ${{ github.event_name == 'push' && 1 || 2 }}
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 包要同时编两种 Apple 架构
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖（只有 @tauri-apps/cli）
        run: npm ci

      # ---- 以后加 Windows 签名：在这里加一步导入证书（仅 windows-latest），见
      # https://v2.tauri.app/distribute/sign/windows/ ：
      #   - 仓库 Secrets 加 WINDOWS_CERTIFICATE（base64 的 .pfx）和 WINDOWS_CERTIFICATE_PASSWORD；
      #   - 用 certutil -decode 还原 .pfx，再 Import-PfxCertificate 导入 Cert:\CurrentUser\My；
      #   - tauri.conf.json 的 bundle.windows 里填 certificateThumbprint / digestAlgorithm: "sha256" / timestampUrl，
      #     或者改用 signCommand（Azure Artifact Signing、Key Vault 等）。

      - name: 检查 macOS 签名配置
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ $MACOS_HAS_CERTIFICATE != true && $MACOS_HAS_CERTIFICATE_PASSWORD != true ]]; then
            exit 0
          fi
          if [[ $MACOS_HAS_CERTIFICATE != true || $MACOS_HAS_CERTIFICATE_PASSWORD != true ]]; then
            echo "::error::请同时配置或同时清除 MACOS_SIGNING_CERT_P12_BASE64 和 MACOS_SIGNING_CERT_PASSWORD。"
            exit 1
          fi
          if [[ ! $MACOS_SIGNING_CERT_SHA1 =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::请将 MACOS_SIGNING_CERT_SHA1 设置为 40 位大写十六进制证书指纹。"
            exit 1
          fi

      - name: 检查更新签名配置
        id: updater
        shell: bash
        run: |
          # script 模式只对最终归档签名；缺密钥的手动试跑只构建普通安装包。
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > ci-no-updater.json
          if [[ $HAS_UPDATE_KEYS != true ]]; then
            message='请同时配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。'
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::${message}本次手动构建跳过更新签名及更新清单。"
            echo 'args=--config ci-no-updater.json' >> "$GITHUB_OUTPUT"
          fi

      # tauri 拿到 APPLE_CERTIFICATE 时只认通用名带 Apple 前缀（Developer ID Application: 等）的证书，
      # 自签证书会报 failed to resolve signing identity。所以这里自己导入证书，设为代码签名受信任，
      # 再只给 tauri 一个 APPLE_SIGNING_IDENTITY（证书指纹），让它直接用钥匙串里已有的身份签名。
      - name: 导入并信任自签证书
        if: matrix.platform == 'macos-latest' && env.MACOS_HAS_CERTIFICATE == 'true' && env.MACOS_HAS_CERTIFICATE_PASSWORD == 'true' && inputs.signing_mode != 'script'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sillycat-sign"
          mkdir -p "$dir"
          printf '%s' "$P12_BASE64" | base64 -d > "$dir/c.p12"
          kc="$dir/sillycat.keychain-db"
          kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$dir/c.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # 加入用户搜索列表，codesign 才能按指纹找到身份
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $existing
          openssl pkcs12 -in "$dir/c.p12" -passin env:P12_PASSWORD -nokeys -clcerts -out "$dir/c.pem" \
            || openssl pkcs12 -legacy -in "$dir/c.p12" -passin env:P12_PASSWORD -nokeys -clcerts -out "$dir/c.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$dir/c.pem"
          rm -f "$dir/c.p12" "$dir/c.pem"
          security find-identity -v -p codesigning | grep -F "$MACOS_SIGNING_CERT_SHA1" \
            || { echo "::error::导入后找不到指纹为 $MACOS_SIGNING_CERT_SHA1 的有效签名身份"; exit 1; }

      - name: 用 Tauri 构建并上传
        if: matrix.platform != 'macos-latest' || inputs.signing_mode != 'script'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (env.MACOS_HAS_CERTIFICATE == 'true' && env.MACOS_HAS_CERTIFICATE_PASSWORD == 'true' && env.MACOS_SIGNING_CERT_SHA1 || '-') || '' }}
        with:
          # tauri-action 将空字符串视为未配置 Release。
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SillyCat {0}', github.ref_name) || '' }}
          releaseBody: '捣蛋奶牛猫桌宠。macOS 下载 .dmg（Intel 和 Apple Silicon 通用），Windows 下载 -setup.exe。Windows 7、8、8.1 下载文件名带 win7 的 -setup.exe，并先按 README 常见问题装好 WebView2 109。首次打开需要手动放行。'
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      # 方案 B：--bundles app → macos-sign.sh → hdiutil 和 tar 打包 → 验签。
      # 手动运行上传 workflow artifact。若 B 验收通过并切为标签发布路径，
      # 将这两个同名资产上传到 Windows 步骤使用的同一个草稿 Release。
      - name: 构建 macOS 应用
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app --config ci-no-updater.json

      - name: 用签名脚本签名并打包
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          app="$bundle/macos/SillyCat.app"
          tools/macos-sign.sh sign "$app"
          mkdir -p "$bundle/dmg"
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          ditto "$app" "$staging/SillyCat.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname SillyCat -srcfolder "$staging" -format UDZO \
            "$bundle/dmg/SillyCat_${version}_universal.dmg"
          tar -czf "$bundle/macos/SillyCat_${version}_universal.app.tar.gz" -C "$bundle/macos" SillyCat.app

      # script 模式重新签过 .app，只能签最终 tar.gz；该模式的 latest.json 暂需手动拼。
      - name: 为最终的 script 归档生成更新签名
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script' && env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="src-tauri/target/universal-apple-darwin/release/bundle/macos/SillyCat_${version}_universal.app.tar.gz"
          npm run tauri -- signer sign --app-version "$version" "$archive"

      - name: 验证 macOS 安装包签名
        id: verify-mac
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="$bundle/dmg/SillyCat_${version}_universal.dmg"
          archive="$bundle/macos/SillyCat.app.tar.gz"
          if [[ $SIGNING_MODE == script ]]; then
            archive="$bundle/macos/SillyCat_${version}_universal.app.tar.gz"
          fi

          if [[ $HAS_UPDATE_KEYS == true ]]; then
            test -s "$archive.sig"
          fi

          verify() {
            if [[ $MACOS_HAS_CERTIFICATE == true ]]; then
              tools/verify-mac-signing.sh "$1" "$MACOS_SIGNING_CERT_SHA1"
            else
              tools/verify-mac-signing.sh "$1"
            fi
          }
          fence='```'
          for artifact in "$dmg" "$archive"; do
            result=$(verify "$artifact")
            printf '%s\n' "$result"
            printf '### %s\n\n%stext\n%s\n%s\n\n' "${artifact##*/}" "$fence" "$result" "$fence" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'dmg=%s\narchive=%s\n' "$dmg" "$archive" >> "$GITHUB_OUTPUT"

      # 带更新签名时 CLI 已生成归档；没有更新密钥时 action 会另行压缩 .app。
      - name: 上传 macOS 应用归档
        if: matrix.platform == 'macos-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-universal-app-archive
          path: |
            ${{ steps.verify-mac.outputs.archive }}
            ${{ steps.verify-mac.outputs.archive }}.sig
          if-no-files-found: error

      - name: 验证 Windows NSIS 更新产物
        if: matrix.platform == 'windows-latest' && env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          installer="src-tauri/target/release/bundle/nsis/SillyCat_${version}_x64-setup.exe"
          test -s "$installer"
          test -s "$installer.sig"

      - name: 上传手动构建的 Windows 更新签名
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch' && env.HAS_UPDATE_KEYS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-windows-nsis-signature
          path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: 上传签名脚本生成的 DMG
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-universal-script-dmg
          path: ${{ steps.verify-mac.outputs.dmg }}
          if-no-files-found: error

  # Windows 7 / 8 / 8.1 版。Tauri 2.12 起和 Rust 1.78 起的标准库都不再支持这几个系统，
  # 所以这里单独用 Rust 1.77.2 + Tauri 2.11 再构建一个包，作为同一个 Release 的额外附件。
  # 更新走它自己的清单 latest-win7.json，不会被主线的 latest.json 带到普通 Windows 包上。
  # 主线和 Win7 的构建失败互不阻塞。如果主线 Windows 构建也失败、没有创建草稿 Release，
  # Win7 的上传步骤会报找不到 Release。
  win7:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write # 把 win7 安装包上传到草稿 Release
    env:
      HAS_UPDATE_KEYS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # 默认工具链设为 1.77.2（构建用）；stable 只用来解析依赖，因为按 rust-version 回退选版本要新版 cargo。
      - name: 安装 Rust 1.77.2
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: 安装 stable（只用来解析依赖）
        run: rustup toolchain install stable --profile minimal

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: win7

      # 只改本次构建的工作区，不会进仓库：给清单加 rust-version，把更新插件放宽到 2.x 里能配 Tauri 2.11 的版本，
      # 再让 cargo 按 rust-version 重新选依赖版本，得到 1.77.2 能编的 Cargo.lock。
      - name: 生成适配 Rust 1.77.2 的依赖锁
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          sed -i 's/^edition = "2021"$/&\nrust-version = "1.77.2"/' Cargo.toml
          sed -i 's/^tauri-plugin-updater = ".*"$/tauri-plugin-updater = "2"/' Cargo.toml
          grep -q '^rust-version = "1.77.2"$' Cargo.toml
          grep -q '^tauri-plugin-updater = "2"$' Cargo.toml
          rm Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
          {
            echo '### Win7 构建解析出的依赖版本'
            echo '```text'
            for p in tauri tauri-plugin-updater tauri-runtime-wry wry webview2-com; do
              awk -v p="$p" '$0=="name = \""p"\""{getline v; print p, v}' Cargo.lock
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 命令行要和 Rust 端的 tauri 2.11 同一个小版本。
      # 2.11 CLI 不在签名里写版本号，所以 Win7 关闭签名中的版本号要求，签名仍用同一把密钥校验。
      - name: 安装前端依赖，并换成 Tauri 2.11 的命令行
        shell: bash
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@2.11.5
          npx tauri --version

      - name: 检查更新签名配置
        id: updater
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > ci-no-updater.json
          if [[ $HAS_UPDATE_KEYS != true ]]; then
            message='请同时配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。'
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::${message}本次手动构建跳过更新签名及更新清单。"
            echo 'args=--config ci-no-updater.json' >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Win7 版 NSIS 安装包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ARGS: ${{ steps.updater.outputs.args }}
        run: |
          rustc --version
          # shellcheck disable=SC2086
          npx tauri build --bundles nsis --ci --config src-tauri/tauri.win7.conf.json $UPDATER_ARGS

      # 导入表里有 Win8 以上才有的接口就让这一步失败，免得发出一个在 Win7 上打不开的包。
      - name: 检查导入表
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install pefile
          python tools/win7-check-imports.py src-tauri/target/release/silly-cat.exe | tee win7-imports-report.txt
          {
            echo '### Win7 导入表检查'
            echo '```text'
            cat win7-imports-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          src="src-tauri/target/release/bundle/nsis/SillyCat_${version}_x64-setup.exe"
          name="SillyCat_${version}_win7_x64-setup.exe"
          test -s "$src"
          mkdir -p out
          cp "$src" "out/$name"
          cp win7-imports-report.txt out/
          if [[ $HAS_UPDATE_KEYS == true ]]; then
            test -s "$src.sig"
            cp "$src.sig" "out/$name.sig"
            tag=v$version
            if [[ $GITHUB_EVENT_NAME == push ]]; then tag=$GITHUB_REF_NAME; fi
            node tools/make-win7-manifest.mjs "$version" "$tag" "$name" "out/$name.sig" out/latest-win7.json
          fi
          ls -la out

      # 草稿 Release 按标签查不到，所以先列出 Release 找到编号，再用上传接口直接传。重跑时先删同名旧附件。
      - name: 上传到草稿 Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "map(select(.tag_name==\"$GITHUB_REF_NAME\"))[0].id")
          if [[ -z $id || $id == null ]]; then
            echo "::error::找不到标签 $GITHUB_REF_NAME 对应的 Release"
            exit 1
          fi
          for f in out/SillyCat_*_win7_x64-setup.exe out/SillyCat_*_win7_x64-setup.exe.sig out/latest-win7.json; do
            n=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq ".[] | select(.name==\"$n\") | .id")
            if [[ -n $old ]]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            curl -sS --fail -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$n" > /dev/null
            echo "已上传 $n"
          done

      - name: 上传 workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-win7
          path: out/*
          if-no-files-found: warn

  # 发布的同时同步到 Gitee（gitee.com/ailcc/silly-cat）：
  # 1. 把草稿 Release 里的全部安装包上传到 Gitee 同名 Release；
  # 2. 把清单里的 GitHub 下载地址换成 Gitee 地址，写进仓库 updates/ 目录并提交——
  #    App 的备用更新端点读 gitee.com/ailcc/silly-cat/raw/main/updates/latest.json，
  #    所以 Gitee 版清单必须以固定路径放进仓库（Gitee Release 没有固定 latest 下载地址）。
  #    这次提交会触发 sync-gitee.yml 把 updates/ 镜像到 Gitee。
  # 主线构建失败时不同步（免得 Gitee 上只有半套包）；Win7 构建失败只少一个包，照常同步。
  gitee:
    needs: [build, win7, electron]
    if: ${{ !cancelled() && github.repository == 'ailcc/silly-cat' && github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交 updates/ 下的 Gitee 版更新清单到 main
    env:
      GITEE_REPO: ailcc/silly-cat
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: 下载草稿 Release 的全部资产
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --dir assets --clobber
          ls -la assets

      - name: 生成 Gitee 版更新清单
        run: |
          set -euo pipefail
          mkdir -p updates
          # tauri-action 在草稿阶段生成的 latest.json 用的是 api.github.com 资产地址
          # （发布后才可匿名下载），路径末段是数字资产 ID 而不是文件名，直接取末段会生成
          # .../download/v1.2.2/791511771 这种 404 地址（2026-11-25 v1.2.2 实测踩坑）。
          # 所以先拉一份「资产 ID -> 文件名」对照表，再统一映射成 Gitee 下载地址。
          rel_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [[ -n "$rel_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$rel_id/assets" --paginate \
              --jq '.[] | "\(.id) \(.name)"' > /tmp/asset-map.txt
          else
            : > /tmp/asset-map.txt
          fi
          cat > /tmp/manifest-rewrite.mjs <<'NODE'
            import fs from 'node:fs';
            // 把清单里各平台的下载地址统一改写到指定前缀（Gitee 版 / GitHub 兜底版共用）。
            // [源清单, 目标清单, 下载地址前缀(含标签), 资产ID->文件名对照表]
            const [src, dst, prefix, mapFile] = process.argv.slice(2);
            const map = new Map();
            if (mapFile && fs.existsSync(mapFile)) {
              for (const line of fs.readFileSync(mapFile, 'utf8').split('\n')) {
                const i = line.indexOf(' ');
                if (i > 0) map.set(line.slice(0, i).trim(), line.slice(i + 1).trim());
              }
            }
            const m = JSON.parse(fs.readFileSync(src, 'utf8'));
            for (const v of Object.values(m.platforms || {})) {
              const path = new URL(v.url).pathname;
              const last = decodeURIComponent(path.split('/').pop());
              const id = (path.match(/\/assets\/(\d+)$/) || [])[1];
              const name = id && map.has(id) ? map.get(id) : last;
              v.url = `${prefix}/${name}`;
            }
            fs.writeFileSync(dst, JSON.stringify(m, null, 2));
          NODE
          gitee_prefix="https://gitee.com/ailcc/silly-cat/releases/download/$GITHUB_REF_NAME"
          github_prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          node /tmp/manifest-rewrite.mjs assets/latest.json updates/latest.json "$gitee_prefix" /tmp/asset-map.txt
          if [[ -f assets/latest-win7.json ]]; then
            node /tmp/manifest-rewrite.mjs assets/latest-win7.json updates/latest-win7.json "$gitee_prefix" /tmp/asset-map.txt
          else
            echo "::warning::没有 latest-win7.json（Win7 构建可能失败了），本次跳过 Win7 清单"
          fi
          # Electron 兼容版清单：electron job 晚于 build 结束，needs 已串行等待，这里正常都在
          if [[ -f assets/latest-electron.json ]]; then
            node /tmp/manifest-rewrite.mjs assets/latest-electron.json updates/latest-electron.json "$gitee_prefix" /tmp/asset-map.txt
          else
            echo "::warning::没有 latest-electron.json（Electron 构建可能失败了），本次跳过 Electron 清单"
          fi
          # 兜底校验：清单里不允许再出现纯数字的资产 ID 地址
          if grep -qE 'releases/download/[^/]+/[0-9]+"' updates/latest.json; then
            echo "::error::更新清单仍是资产 ID 而非文件名，终止发布"
            exit 1
          fi
          # GitHub 兜底清单也要改写：api.github.com 的资产地址在国内常连不通，
          # 换成 github.com 的普通下载地址后，老客户端从 GitHub 兜底时还有机会下载成功
          mkdir -p github-manifests
          node /tmp/manifest-rewrite.mjs assets/latest.json github-manifests/latest.json "$github_prefix" /tmp/asset-map.txt
          for name in latest-win7.json latest-electron.json; do
            [[ -f assets/$name ]] && node /tmp/manifest-rewrite.mjs "assets/$name" "github-manifests/$name" "$github_prefix" /tmp/asset-map.txt
          done
          gh release upload "$GITHUB_REF_NAME" github-manifests/*.json -R "$GITHUB_REPOSITORY" --clobber
          echo '--- updates/latest.json ---'
          cat updates/latest.json

      - name: 提交更新清单到 main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates
          if git diff --cached --quiet; then
            echo "清单没有变化，跳过提交"
            exit 0
          fi
          git commit -m "更新清单：$GITHUB_REF_NAME 的 Gitee 镜像地址"
          git push origin HEAD:main

      # 安装包不再自动传 Gitee（上传通道慢且经常卡死，2026-11-27 定）：只创建 Release 占位，
      # 安装包由人从 GitHub Release 下载后手动上传到这个 Gitee Release。
      # 重跑时若 Release 已存在直接跳过——不删除，避免清掉手动上传的文件。
      - name: 创建 Gitee Release（文件手动上传）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/$GITEE_REPO"
          old=$(curl -sS --max-time 30 "$api/releases/tags/$GITHUB_REF_NAME?access_token=$GITEE_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s);console.log(r.id||"")}catch{console.log("")}})')
          if [[ -n $old ]]; then
            echo "Gitee Release 已存在（编号 $old），跳过创建；请手动确认安装包已上传"
          else
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq 'map(select(.tag_name==env.GITHUB_REF_NAME))[0].body')
            # target_commitish 是 Gitee 必填字段（2026-11-25 实测缺了会报 "target_commitish is missing"）
            payload=$(node -e 'const [tag,name,body]=process.argv.slice(1);console.log(JSON.stringify({tag_name:tag,name,body,prerelease:false,target_commitish:"main"}))' "$GITHUB_REF_NAME" "SillyCat $GITHUB_REF_NAME" "$body")
            rid=$(curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$api/releases?access_token=$GITEE_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(!r.id){process.stderr.write(s);process.exit(1)}console.log(r.id)})')
            echo "Gitee Release 创建成功（编号 $rid）：https://gitee.com/$GITEE_REPO/releases"
            echo "请从 GitHub Release 下载安装包，手动上传到上面的 Gitee Release（含 updates/ 三份清单）"
          fi

      # 维护常驻的 latest 标签 Release：客户端更新端点的第一优先源指向它
      # （releases/download/latest/…走 foruda.gitee.com，可达性比 raw.giteeusercontent.com
      # 好——2026-11-28 实测 raw 在部分网络被重置）。每次发版用新清单覆盖同名附件。
      - name: 维护 Gitee latest 常驻更新清单
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/$GITEE_REPO"
          rid=$(curl -sS --max-time 30 "$api/releases/tags/latest?access_token=$GITEE_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s);console.log(r.id||"")}catch{console.log("")}})')
          if [[ -z $rid ]]; then
            payload=$(node -e 'console.log(JSON.stringify({tag_name:"latest",name:"更新清单（常驻）",body:"此 Release 只存放最新版的三份更新清单，由 CI 每次发版自动覆盖。不要从这里下载安装包。",prerelease:false,target_commitish:"main"}))')
            rid=$(curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$api/releases?access_token=$GITEE_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(!r.id){process.stderr.write(s);process.exit(1)}console.log(r.id)})')
            echo "Gitee latest 常驻 Release 已创建（编号 $rid）"
          fi
          for name in latest.json latest-win7.json latest-electron.json; do
            file="updates/$name"
            if [[ ! -f $file ]]; then continue; fi
            # 同名附件不会自动覆盖，先删旧的再传新的
            curl -sS --max-time 30 "$api/releases/$rid/attach_files?access_token=$GITEE_TOKEN" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                for (const a of JSON.parse(s)) if (a.name === process.argv[1]) console.log(a.id);
              }' "$name" | while read -r aid; do
                [[ -n $aid ]] && curl -sS --max-time 30 -X DELETE "$api/releases/$rid/attach_files/$aid?access_token=$GITEE_TOKEN" -o /dev/null
              done
            code=$(curl -sS --max-time 300 -X POST "$api/releases/$rid/attach_files?access_token=$GITEE_TOKEN" \
              -F "file=@$file" -o /tmp/attach.json -w "%{http_code}")
            node -e 'const r=require("/tmp/attach.json");if(!r.name)process.exit(1);console.log("已更新清单", r.name)' || { cat /tmp/attach.json; exit 1; }
            echo "$name 上传返回 $code"
          done
          echo "Gitee latest 清单已刷新：https://gitee.com/$GITEE_REPO/releases/download/latest/"

  # Windows 7 / 8 / 8.1 兼容版（Electron 22，不依赖 WebView2）。
  # 和正式版共用同一套 Tauri 更新密钥签名；构建产物、.sig 和 latest-electron.json 挂到同一个草稿 Release。
  electron:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_UPDATE_KEYS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          # 固定 22（npm 10）：lts/* 已到 Node 26，它的 npm 默认不跑依赖的安装脚本，
          # electron 本体、koffi、uiohook-napi 都靠安装脚本准备，跳过后自检直接失败。
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: 安装 Tauri CLI
        run: npm ci

      - name: 安装 Electron 依赖
        working-directory: electron
        run: npm ci

      - name: 检查版本一致性
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          electron_version=$(node -p "require('./electron/package.json').version")
          if [[ $electron_version != "$version" ]]; then
            echo "::error file=electron/package.json::请将 electron/package.json 和 electron/package-lock.json 的版本从 $electron_version 改为 $version，与 src-tauri/tauri.conf.json 一致。"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 检查更新签名配置
        shell: bash
        run: |
          if [[ $HAS_UPDATE_KEYS != true ]]; then
            message='请同时配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。'
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::${message}本次手动构建跳过更新签名及更新清单。"
          fi

      - name: 运行无界面自检
        shell: bash
        working-directory: electron
        run: |
          node selftest.js --selftest
          node tools/test-input-hook.cjs
          ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron.exe updater-test.js

      - name: 运行窗口自检
        id: electron-window
        continue-on-error: true
        timeout-minutes: 3
        working-directory: electron
        run: |
          npx --no-install electron . --selftest --selftest-out "$env:RUNNER_TEMP/electron-selftest"
          exit $LASTEXITCODE

      - name: 记录窗口自检结果
        if: ${{ !cancelled() && (steps.electron-window.outcome == 'success' || steps.electron-window.outcome == 'failure') }}
        env:
          WINDOW_OUTCOME: ${{ steps.electron-window.outcome }}
        run: |
          "### Electron 窗口自检（$env:WINDOW_OUTCOME）" >> $env:GITHUB_STEP_SUMMARY
          $report = Join-Path $env:RUNNER_TEMP 'electron-selftest/selftest.json'
          if (Test-Path $report) {
            '~~~json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content -Raw -Encoding utf8 $report >> $env:GITHUB_STEP_SUMMARY
            '~~~' >> $env:GITHUB_STEP_SUMMARY
          } else {
            '窗口自检未生成报告，请查看该步骤日志。' >> $env:GITHUB_STEP_SUMMARY
          }
          if ($env:WINDOW_OUTCOME -ne 'success') {
            Write-Output '::warning::Electron 窗口自检未通过，请查看步骤日志和摘要。'
          }

      - name: 安装音频检测程序的 Win7 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: x86_64-pc-windows-msvc

      # 静态链接 C 运行库：检测程序放在 resources/audio-probe/ 下单独启动，找不到 Electron 目录里的 DLL；
      # 动态链接会依赖 vcruntime140.dll（VC++ 运行库）和 api-ms-win-crt（Win7 要 KB2999226），没装的机器上起不来。
      - name: 构建音频检测程序
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo +1.77.2 build --release --locked --manifest-path tools/audio-probe/Cargo.toml
          python -m pip install pefile
          exe=tools/audio-probe/target/release/silly-audio-probe.exe
          dlls=$(python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); print(' '.join(e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT))" "$exe")
          echo "检测程序导入的 DLL：$dlls"
          if grep -qiE 'vcruntime|msvcp|api-ms-win-crt|ucrtbase' <<< "$dlls"; then
            echo "::error file=$exe::检测程序仍依赖 VC++ 运行库或 UCRT，没装的机器上起不来"
            exit 1
          fi

      - name: 构建兼容版安装包和免安装包
        working-directory: electron
        # 用 bash：PowerShell 会把 -c.win.xxx 从点处拆成 -c 和 .win.xxx，electron-builder 会把后者当配置文件路径。
        shell: bash
        run: npm run dist -- -c.win.signAndEditExecutable=true --publish never

      - name: 检查兼容版的原生模块导入表
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install pefile
          mkdir -p out
          report=out/electron-imports-report.txt
          : > "$report"
          modules=electron/dist/win-unpacked/resources/app.asar.unpacked/node_modules
          failed=0
          for module in \
            "electron/dist/win-unpacked/resources/audio-probe/silly-audio-probe.exe" \
            "$modules/@koromix/koffi-win32-x64/win32_x64/koffi.node" \
            "$modules/uiohook-napi/prebuilds/win32-x64/uiohook-napi.node"; do
            if ! python tools/win7-check-imports.py "$module" >> "$report" 2>&1; then
              failed=1
            fi
          done
          cat "$report"
          {
            echo '### Electron 原生模块导入表检查'
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: 整理兼容版产物
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          base="SillyCat_${VERSION}_electron_x64"
          test -s "electron/dist/$base-setup.exe"
          test -s "electron/dist/$base.zip"
          cp "electron/dist/$base-setup.exe" "electron/dist/$base.zip" out/

      - name: 生成兼容版更新签名
        if: env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="out/SillyCat_${VERSION}_electron_x64-setup.exe"
          npm run tauri -- signer sign --app-version "$VERSION" "$installer"

      - name: 复核签名并生成更新清单
        if: env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="SillyCat_${VERSION}_electron_x64-setup.exe"
          ELECTRON_RUN_AS_NODE=1 ./electron/node_modules/electron/dist/electron.exe \
            electron/tools/verify-update-signature.cjs "out/$name" "out/$name.sig" "$VERSION"
          tag=v$VERSION
          if [[ $GITHUB_EVENT_NAME == push ]]; then tag=$GITHUB_REF_NAME; fi
          node electron/tools/make-electron-manifest.mjs "$VERSION" "$tag" "$name" "out/$name.sig" out/latest-electron.json

      - name: 上传到草稿 Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag and .draft)][0].id // empty')
          if [[ -z $id ]]; then
            echo "::error::找不到标签 $GITHUB_REF_NAME 对应的草稿 Release"
            exit 1
          fi
          base="SillyCat_${VERSION}_electron_x64"
          for n in "$base-setup.exe" "$base-setup.exe.sig" "$base.zip" latest-electron.json; do
            test -s "out/$n"
            old=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" |
              jq -r --arg name "$n" '.[][] | select(.name == $name) | .id')
            if [[ -n $old ]]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            curl -sS --fail -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"out/$n" --url-query "name=$n" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets" > /dev/null
            echo "已上传 $n"
          done

      - name: 上传 workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-electron
          path: out/*
          if-no-files-found: warn
