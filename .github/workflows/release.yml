# 打包发布：推送 v* 标签（例如 git tag v0.0.2 && git push origin v0.0.2）时，
# 在 macOS（universal：Intel + Apple Silicon 一个包）和 Windows（NSIS 安装包）上各自构建，
# 把安装包挂到同一个「草稿」Release 上，确认没问题后再到 GitHub 网页上手动发布。
#
# 写法参照 Tauri 2 官方文档 https://v2.tauri.app/distribute/pipelines/github/ 和
# https://github.com/tauri-apps/tauri-action （2026-11 查阅：tauri-action@v1、checkout@v7、setup-node@v6）。
# 手动运行只生成 workflow artifacts。macOS 有证书时固定签名，首次打开仍需在「隐私与安全性」放行。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: macOS 签名方式（tauri 默认，script 用于自签证书导入失败时）
        type: choice
        default: tauri
        options:
          - tauri
          - script

jobs:
  build:
    permissions:
      contents: write # 创建 Release、上传安装包
    env:
      HAS_UPDATE_KEYS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
      MACOS_HAS_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.MACOS_SIGNING_CERT_P12_BASE64 != '' }}
      MACOS_HAS_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.MACOS_SIGNING_CERT_PASSWORD != '' }}
      MACOS_SIGNING_CERT_SHA1: ${{ matrix.platform == 'macos-latest' && vars.MACOS_SIGNING_CERT_SHA1 || '' }}
    strategy:
      # 两个 runner 依次创建/更新同一草稿和 latest.json，避免同时读写时覆盖平台条目。
      max-parallel: ${{ github.event_name == 'push' && 1 || 2 }}
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 包要同时编两种 Apple 架构
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖（只有 @tauri-apps/cli）
        run: npm ci

      # ---- 以后加 Windows 签名：在这里加一步导入证书（仅 windows-latest），见
      # https://v2.tauri.app/distribute/sign/windows/ ：
      #   - 仓库 Secrets 加 WINDOWS_CERTIFICATE（base64 的 .pfx）和 WINDOWS_CERTIFICATE_PASSWORD；
      #   - 用 certutil -decode 还原 .pfx，再 Import-PfxCertificate 导入 Cert:\CurrentUser\My；
      #   - tauri.conf.json 的 bundle.windows 里填 certificateThumbprint / digestAlgorithm: "sha256" / timestampUrl，
      #     或者改用 signCommand（Azure Artifact Signing、Key Vault 等）。

      - name: 检查 macOS 签名配置
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ $MACOS_HAS_CERTIFICATE != true && $MACOS_HAS_CERTIFICATE_PASSWORD != true ]]; then
            exit 0
          fi
          if [[ $MACOS_HAS_CERTIFICATE != true || $MACOS_HAS_CERTIFICATE_PASSWORD != true ]]; then
            echo "::error::请同时配置或同时清除 MACOS_SIGNING_CERT_P12_BASE64 和 MACOS_SIGNING_CERT_PASSWORD。"
            exit 1
          fi
          if [[ ! $MACOS_SIGNING_CERT_SHA1 =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::请将 MACOS_SIGNING_CERT_SHA1 设置为 40 位大写十六进制证书指纹。"
            exit 1
          fi

      - name: 检查更新签名配置
        id: updater
        shell: bash
        run: |
          # script 模式只对最终归档签名；缺密钥的手动试跑只构建普通安装包。
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > ci-no-updater.json
          if [[ $HAS_UPDATE_KEYS != true ]]; then
            message='请同时配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。'
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::${message}本次手动构建跳过更新签名及更新清单。"
            echo 'args=--config ci-no-updater.json' >> "$GITHUB_OUTPUT"
          fi

      - name: 用 Tauri 构建并上传
        if: matrix.platform != 'macos-latest' || inputs.signing_mode != 'script'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.MACOS_HAS_CERTIFICATE == 'true' && secrets.MACOS_SIGNING_CERT_P12_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.MACOS_HAS_CERTIFICATE_PASSWORD == 'true' && secrets.MACOS_SIGNING_CERT_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (env.MACOS_HAS_CERTIFICATE == 'true' && env.MACOS_HAS_CERTIFICATE_PASSWORD == 'true' && env.MACOS_SIGNING_CERT_SHA1 || '-') || '' }}
        with:
          # tauri-action 将空字符串视为未配置 Release。
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SillyCat {0}', github.ref_name) || '' }}
          releaseBody: '捣蛋奶牛猫桌宠。macOS 下载 .dmg（Intel 和 Apple Silicon 通用），Windows 下载 -setup.exe。首次打开需要手动放行。'
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      # 方案 B：--bundles app → macos-sign.sh → hdiutil 和 tar 打包 → 验签。
      # 手动运行上传 workflow artifact。若 B 验收通过并切为标签发布路径，
      # 将这两个同名资产上传到 Windows 步骤使用的同一个草稿 Release。
      - name: 构建 macOS 应用
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app --config ci-no-updater.json

      - name: 用签名脚本签名并打包
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          app="$bundle/macos/SillyCat.app"
          tools/macos-sign.sh sign "$app"
          mkdir -p "$bundle/dmg"
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          ditto "$app" "$staging/SillyCat.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname SillyCat -srcfolder "$staging" -format UDZO \
            "$bundle/dmg/SillyCat_${version}_universal.dmg"
          tar -czf "$bundle/macos/SillyCat_${version}_universal.app.tar.gz" -C "$bundle/macos" SillyCat.app

      # script 模式重新签过 .app，只能签最终 tar.gz；该模式的 latest.json 暂需手动拼。
      - name: 为最终的 script 归档生成更新签名
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script' && env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="src-tauri/target/universal-apple-darwin/release/bundle/macos/SillyCat_${version}_universal.app.tar.gz"
          npm run tauri -- signer sign --app-version "$version" "$archive"

      - name: 验证 macOS 安装包签名
        id: verify-mac
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="$bundle/dmg/SillyCat_${version}_universal.dmg"
          archive="$bundle/macos/SillyCat.app.tar.gz"
          if [[ $SIGNING_MODE == script ]]; then
            archive="$bundle/macos/SillyCat_${version}_universal.app.tar.gz"
          fi

          if [[ $HAS_UPDATE_KEYS == true ]]; then
            test -s "$archive.sig"
          fi

          verify() {
            if [[ $MACOS_HAS_CERTIFICATE == true ]]; then
              tools/verify-mac-signing.sh "$1" "$MACOS_SIGNING_CERT_SHA1"
            else
              tools/verify-mac-signing.sh "$1"
            fi
          }
          fence='```'
          for artifact in "$dmg" "$archive"; do
            result=$(verify "$artifact")
            printf '%s\n' "$result"
            printf '### %s\n\n%stext\n%s\n%s\n\n' "${artifact##*/}" "$fence" "$result" "$fence" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'dmg=%s\narchive=%s\n' "$dmg" "$archive" >> "$GITHUB_OUTPUT"

      # 带更新签名时 CLI 已生成归档；没有更新密钥时 action 会另行压缩 .app。
      - name: 上传 macOS 应用归档
        if: matrix.platform == 'macos-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-universal-app-archive
          path: |
            ${{ steps.verify-mac.outputs.archive }}
            ${{ steps.verify-mac.outputs.archive }}.sig
          if-no-files-found: error

      - name: 验证 Windows NSIS 更新产物
        if: matrix.platform == 'windows-latest' && env.HAS_UPDATE_KEYS == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          installer="src-tauri/target/release/bundle/nsis/SillyCat_${version}_x64-setup.exe"
          test -s "$installer"
          test -s "$installer.sig"

      - name: 上传手动构建的 Windows 更新签名
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch' && env.HAS_UPDATE_KEYS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-windows-nsis-signature
          path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: 上传签名脚本生成的 DMG
        if: matrix.platform == 'macos-latest' && inputs.signing_mode == 'script'
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-universal-script-dmg
          path: ${{ steps.verify-mac.outputs.dmg }}
          if-no-files-found: error
