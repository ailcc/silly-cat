<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>捣蛋奶牛猫 · 设置</title>
<style>
  :root {
    --ink: #1d1b22;
    --muted: #6d6873;
    --bg: #fbf6ea;
    --card: #fffdf8;
    --line: #e8dfca;
    --accent: #ff7a59;
    --error: #d64545;
    --ok: #4f8a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 14px 16px 12px;
  }
  h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  form { display: flex; flex-direction: column; gap: 8px; }
  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  label { font-weight: 600; }
  .field { display: flex; align-items: center; gap: 6px; flex: none; }
  input {
    width: 78px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    text-align: right;
    background: #fff;
    color: var(--ink);
  }
  input:focus { outline: 2px solid rgba(255, 122, 89, 0.45); outline-offset: 0; border-color: var(--accent); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .unit { color: var(--muted); }
  .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .err { margin-top: 2px; color: var(--error); font-size: 12px; }
  .err:empty { display: none; }
  footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  button {
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--error); }
</style>
</head>
<body>
<h1>猫的作息</h1>
<form id="form" novalidate autocomplete="off">
  <div class="row" data-key="sleep">
    <div class="head"><label for="f-sleep">多久不操作就睡着</label>
      <span class="field"><input id="f-sleep" type="number" inputmode="decimal"><span class="unit">秒</span></span></div>
    <div class="hint">没有按键、点鼠标、摸头这么久就睡着（只动鼠标不算），过一半时开始犯困。</div>
    <div class="err"></div>
  </div>
  <div class="row" data-key="drool">
    <div class="head"><label for="f-drool">多久开始流口水</label>
      <span class="field"><input id="f-drool" type="number" inputmode="decimal"><span class="unit">秒</span></span></div>
    <div class="hint">从最后一次操作算起，要比入睡时间长。留空 = 自动（入睡时间 × 2，现在是 <b data-auto="drool"></b> 秒）。</div>
    <div class="err"></div>
  </div>
  <div class="row" data-key="slump">
    <div class="head"><label for="f-slump">多久趴到键盘上</label>
      <span class="field"><input id="f-slump" type="number" inputmode="decimal"><span class="unit">秒</span></span></div>
    <div class="hint">从最后一次操作算起，要比开始流口水晚。留空 = 自动（入睡时间 × 3.5，现在是 <b data-auto="slump"></b> 秒）。</div>
    <div class="err"></div>
  </div>
  <div class="row" data-key="work">
    <div class="head"><label for="f-work">连续打字多久会发飙</label>
      <span class="field"><input id="f-work" type="number" inputmode="decimal"><span class="unit">秒</span></span></div>
    <div class="hint">一直打字时疲劳涨满所需的时间；停手时疲劳按 3 倍速回落。涨满就砸键盘、罢工。</div>
    <div class="err"></div>
  </div>
  <div class="row" data-key="rest">
    <div class="head"><label for="f-rest">罢工后歇多久消气</label>
      <span class="field"><input id="f-rest" type="number" inputmode="decimal"><span class="unit">秒</span></span></div>
    <div class="hint">罢工期间累计休息这么久就消气、自己修好键盘（摸头时休息算双倍）。</div>
    <div class="err"></div>
  </div>
</form>
<footer>
  <button id="reset" type="button">恢复默认</button>
  <span id="status"></span>
</footer>

<script src="settings.js"></script>
<script>
(function () {
  'use strict';
  const S = window.SillySettings;
  const T = window.__TAURI__;
  const invoke = T && T.core ? T.core.invoke : null;
  const statusEl = document.getElementById('status');
  const rows = {};
  for (const k of S.KEYS) {
    const row = document.querySelector(`.row[data-key="${k}"]`);
    const f = S.FIELDS[k];
    const input = row.querySelector('input');
    input.min = String(f.min);
    input.max = String(f.max);
    input.step = '1';
    if (f.optional) input.placeholder = '自动';
    rows[k] = { row, input, err: row.querySelector('.err'), f };
  }

  const fmt = (v) => String(Math.round(v * 100) / 100);
  function fill(s) {
    for (const k of S.KEYS) {
      const { input, f } = rows[k];
      input.value = s[k] === null ? '' : fmt(s[k]);
    }
    refreshHints(s);
  }
  // 都是秒；可选项留空 = null（自动），其他留空 = NaN（校验报错）
  function read() {
    const s = {};
    for (const k of S.KEYS) {
      const { input, f } = rows[k];
      const t = input.value.trim();
      if (t === '') s[k] = f.optional ? null : NaN;
      else s[k] = Number(t);
    }
    return s;
  }
  function refreshHints(s) {
    const sleep = Number.isFinite(s.sleep) && s.sleep > 0 ? s.sleep : S.DEFAULTS.sleep;
    for (const b of document.querySelectorAll('[data-auto]')) b.textContent = fmt(S.AUTO[b.dataset.auto] * sleep);
  }
  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  let timer = 0;
  function onEdit() {
    const s = read();
    refreshHints(s);
    const err = S.validate(s);
    for (const k of S.KEYS) {
      rows[k].err.textContent = err[k] || '';
      rows[k].input.setAttribute('aria-invalid', err[k] ? 'true' : 'false');
    }
    clearTimeout(timer);
    if (Object.keys(err).length) { setStatus('有设置不合法，没有保存', 'bad'); return; }
    setStatus('…');
    timer = setTimeout(() => save(s), 250);
  }
  function save(s) {
    if (!invoke) { setStatus('不在桌面版里，改动不会保存', 'bad'); return; }
    invoke('save_settings', { settings: s })
      .then(() => setStatus('已保存，猫那边已生效', 'ok'))
      .catch((e) => setStatus('保存失败：' + e, 'bad'));
  }

  document.getElementById('form').addEventListener('input', onEdit);
  document.getElementById('form').addEventListener('submit', (e) => e.preventDefault());
  document.getElementById('reset').addEventListener('click', () => { fill(S.DEFAULTS); onEdit(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && T && T.window) T.window.getCurrentWindow().close().catch(() => {});
  });

  fill(S.DEFAULTS);
  if (invoke) {
    invoke('load_settings').then((raw) => { if (raw) fill(S.sanitize(raw)); }).catch(() => {});
  }
  setTimeout(() => rows.sleep.input.focus(), 50);
})();
</script>
</body>
</html>
