<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>捣蛋奶牛猫</title>
<link rel="stylesheet" href="style.css">
<script>/* 桌面外壳（Tauri）里进入桌面模式：只留猫、键盘、鼠标和特效 */ if (window.__TAURI__) document.documentElement.classList.add('desktop');</script>
</head>
<body>
<header class="hint">在这页上随便敲键盘</header>

<main id="stage">
<svg id="scene" viewBox="0 0 800 620" role="img" aria-label="坐在键盘后面的奶牛猫" data-hp-color="strawberry">
  <defs>
    <clipPath id="clip-head">
      <path id="clip-head-path" d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/>
    </clipPath>
    <clipPath id="clip-body">
      <path/>
    </clipPath>
    <clipPath id="clip-back-head"><path d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/></clipPath>
    <clipPath id="clip-back-body"><path/></clipPath>
    <clipPath id="clip-eye-l"><circle cx="345" cy="178" r="29"/></clipPath>
    <clipPath id="clip-eye-r"><circle cx="455" cy="178" r="29"/></clipPath>
    <clipPath id="clip-puppy-l"><circle cx="363.108" cy="182" r="15"/></clipPath>
    <clipPath id="clip-puppy-r"><circle cx="436.892" cy="182" r="15"/></clipPath>
    <!-- 小狗眼：暖棕虹膜，中间浅、外圈深，中间压一颗黑瞳孔 -->
    <radialGradient id="puppy-iris" cx=".5" cy=".56" r=".6">
      <stop stop-color="#8a5630"/>
      <stop offset=".55" stop-color="#5b341b"/>
      <stop offset=".85" stop-color="#2e1a0d"/>
      <stop offset="1" stop-color="#170d06"/>
    </radialGradient>
    <!-- 前面那份尾巴的遮罩：盖掉身体（连同描边）那一块，尾巴从身后出来的部分仍被身体挡住。变换由 cat.js 跟着身体设置 -->
    <mask id="mask-tail-front" maskUnits="userSpaceOnUse" x="-20" y="-50" width="840" height="690">
      <rect x="-20" y="-50" width="840" height="690" fill="#fff"/>
      <path id="mask-tail-body" fill="#000" stroke="#000" stroke-width="5"/>
    </mask>
  </defs>

  <ellipse id="ground-shadow" class="shadow" cx="400" cy="594" rx="300" ry="20"/>

  <!-- 尾巴：黑色带白尖，轮廓由 cat.js 每帧按中线算（平时在身后摆，动鼠标时绕到前面搭在鼠标上） -->
  <g id="tail">
    <path id="tail-body" class="tail-body" d="M 322 370 C 272 372, 222 374, 198 350 C 182 334, 184 314, 198 306"/>
    <path id="tail-rings" class="tail-ring" d=""/>
    <path id="tail-tip" class="tail-tip-fill" d=""/>
  </g>

  <!-- 身体：白底梨形，观众右侧腰上一块鞍状黑斑 -->
  <g id="cat-body">
    <path class="coat-base"/>
    <g id="coat-body-patterns" clip-path="url(#clip-body)">
      <path class="coat-cow-marking" d="M 470 288 C 494 290, 512 320, 512 352 C 512 378, 500 394, 486 390 C 474 386, 478 366, 474 350 C 470 332, 460 318, 462 302 C 463 292, 466 288, 470 288 Z"/>
    </g>
    <path class="ink-line" fill="none"/>
    <!-- 后腿的大腿弧线 -->
    <path class="ink-thin" fill="none"/>
  </g>

  <!-- 头：大、歪 4 度 -->
  <g id="cat-head">
    <!-- ear-shape-*：每只猫的耳朵大小（coats.js 设静态缩放）；外层 ear-* 的旋转由 cat.js 每帧设 -->
    <g id="ear-l"><g class="ear-shape-l" data-part="ear-l"></g></g>
    <g id="ear-r"><g class="ear-shape-r" data-part="ear-r"></g></g>

    <g id="head-rear-accessories"></g>
    <path id="head-fill" class="coat-base" d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/>
    <g id="coat-head-patterns" clip-path="url(#clip-head)">
      <!-- 黑色帽子：盖住头顶，在观众左侧向下包住一只眼 -->
      <path class="coat-cow-marking" d="M 255 50 H 545 V 112 C 520 104, 498 101, 470 110 C 452 116, 438 112, 424 122 C 408 134, 398 146, 392 166 C 385 190, 380 214, 346 222 C 316 228, 286 216, 255 202 Z"/>
    </g>
    <path id="head-line" class="ink-line" fill="none" d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/>

    <g id="face-cat-blush" data-species-face="cat">
      <ellipse class="blush" cx="318" cy="232" rx="13" ry="7"/>
      <ellipse class="blush" cx="484" cy="226" rx="13" ry="7"/>
    </g>

    <g class="gaze-features">
      <!-- 左眼（黑斑里） -->
      <g id="eye-l-open">
        <circle class="sclera" cx="345" cy="178" r="29"/>
        <g clip-path="url(#clip-eye-l)">
          <circle id="iris-l" class="iris" cx="345" cy="178" r="21"/>
          <circle id="pupil-l" class="pupil" cx="345" cy="179" r="13"/>
          <circle id="shine-l" class="shine" cx="339" cy="173" r="5"/>
          <rect id="lid-l" class="lid-l" x="314" y="147" width="62" height="10"/>
          <line id="lidline-l" class="lid-line" x1="314" x2="376" y1="157" y2="157"/>
        </g>
        <circle class="eye-ring" cx="345" cy="178" r="29"/>
      </g>
      <path id="eye-l-closed" class="eye-arc-l" style="display:none" d="M 323 180 Q 345 196 367 180"/>
      <path id="eye-l-happy" class="eye-arc-l" style="display:none" d="M 323 186 Q 345 164 367 186"/>

      <!-- 右眼（白脸上） -->
      <g id="eye-r-open">
        <circle class="sclera" cx="455" cy="178" r="29"/>
        <g clip-path="url(#clip-eye-r)">
          <circle id="iris-r" class="iris" cx="455" cy="178" r="21"/>
          <circle id="pupil-r" class="pupil" cx="455" cy="179" r="13"/>
          <circle id="shine-r" class="shine" cx="449" cy="173" r="5"/>
          <rect id="lid-r" class="lid-r" x="424" y="147" width="62" height="10"/>
          <line id="lidline-r" class="lid-line" x1="424" x2="486" y1="157" y2="157"/>
        </g>
        <circle class="eye-ring" cx="455" cy="178" r="29"/>
      </g>
      <path id="eye-r-closed" class="eye-arc-r" style="display:none" d="M 433 180 Q 455 196 477 180"/>
      <path id="eye-r-happy" class="eye-arc-r" style="display:none" d="M 433 186 Q 455 164 477 186"/>
    </g>

    <g id="puppy-l-open" clip-path="url(#clip-puppy-l)" style="display:none">
      <circle id="puppy-l-pupil" class="puppy-pupil"/>
      <circle id="puppy-l-dot" class="puppy-dot"/>
      <circle id="puppy-l-shine" fill="#fff8e8"/>
      <circle id="puppy-l-glint" fill="#f5dfc5"/>
      <rect id="puppy-l-lid" class="lid-l"/>
      <line id="puppy-l-lidline" class="puppy-lid-line"/>
    </g>
    <g id="puppy-r-open" clip-path="url(#clip-puppy-r)" style="display:none">
      <circle id="puppy-r-pupil" class="puppy-pupil"/>
      <circle id="puppy-r-dot" class="puppy-dot"/>
      <circle id="puppy-r-shine" fill="#fff8e8"/>
      <circle id="puppy-r-glint" fill="#f5dfc5"/>
      <rect id="puppy-r-lid" class="lid-r"/>
      <line id="puppy-r-lidline" class="puppy-lid-line"/>
    </g>

    <g id="face-cat" data-species-face="cat">
      <!-- 歪的小胡子斑 -->
      <ellipse class="coat-cow-marking" cx="421" cy="214" rx="11" ry="6.5" transform="rotate(-22 421 214)"/>

      <!-- 胡须 -->
      <path class="whisker" d="M 300 226 L 256 218 M 302 236 L 259 242"/>
      <path class="whisker" d="M 500 224 L 546 214 M 499 234 L 543 240"/>

      <g class="gaze-features">
        <!-- 鼻子、坏笑的 w 嘴和小尖牙 -->
        <path class="fang" d="M 404 232 L 408 242 L 412 231 Z"/>
        <path class="ink-thin coat-mouth-line" fill="none" d="M 400 219 L 400 228 M 383 227 Q 391 237 400 228 Q 410 237 420 224"/>
        <path class="ink-thin coat-nose" d="M 389 206 Q 400 201 411 206 Q 409 216 400 220 Q 391 216 389 206 Z"/>
      </g>
    </g>
    <g id="face-dog" data-species-face="dog" style="display:none" transform="translate(0 12)">
      <g id="dog-mouth-open">
        <path d="M369 227 C377 238 389 231 400 229 C411 231 423 238 431 227 C420 255 381 255 369 227 Z" fill="#57372e" stroke="#442e25" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M400 220 V229" stroke="#442e25" stroke-width="2.8"/>
        <g id="dog-tongue">
          <path d="M389 241 Q400 237 411 241 L410 248 C408 257 392 257 390 248 Z" fill="#df9493" stroke="#5f3930" stroke-width="1.4"/>
          <path d="M400 241 v6" stroke="#bb7175" fill="none" stroke-linecap="round"/>
        </g>
      </g>
      <path id="dog-mouth-closed" style="display:none" d="M400 222 V235 M372 230 C374 235 377 236 381 235 C389 234 393 235 400 235 C407 235 411 234 419 235 C423 236 426 235 428 230" fill="none" stroke="#442e25" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M374 205 C374 198 386 197 400 197 S426 198 427 204 C428 211 418 219 411 222 Q400 226 389 222 C382 219 373 212 374 205 Z" fill="#2e2624" stroke="#32251f" stroke-width="1.6"/>
      <path d="M379 208 Q381 201 389 206 Q391 211 385 212 Q381 212 379 208 Z M421 208 Q419 201 411 206 Q409 211 415 212 Q419 212 421 208 Z" fill="#171313"/>
      <path d="M384 201.5 Q390 199.5 397 200" fill="none" stroke="#947e70" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 以下由 sleep.js / fatigue.js 控制显示 -->
    <!-- 口水：半透明浅蓝白，细描边 -->
    <g id="drool" style="display:none">
      <path id="drool-outline" class="drool-outline" d="M 419 227 L 419 231"/>
      <path id="drool-strand" class="drool-strand" d="M 419 227 L 419 231"/>
      <circle id="drool-bulb" class="drool-bulb" cx="419" cy="233" r="3"/>
    </g>
    <!-- 趴醒后脸颊上的键帽压痕：只在贴键盘的那侧脸颊，裁在头形里 -->
    <g id="imprint" style="display:none" clip-path="url(#clip-head)">
      <ellipse class="imprint-flush"/>
      <g id="imprint-dents">
        <g transform="rotate(-14 300 232)"><rect class="dent" x="284" y="224" width="15" height="13" rx="4"/><rect class="dent-in" x="285.6" y="225.6" width="12" height="10" rx="3"/></g>
        <g transform="rotate(-8 318 230)"><rect class="dent" x="302" y="223" width="15" height="13" rx="4"/><rect class="dent-in" x="303.6" y="224.6" width="12" height="10" rx="3"/>
          <text id="imprint-letter" class="dent-letter" x="0" y="0" transform="translate(309.6 233.4) scale(-1 1)">K</text></g>
        <g transform="rotate(-2 336 232)"><rect class="dent" x="320" y="225" width="15" height="13" rx="4"/><rect class="dent-in" x="321.6" y="226.6" width="12" height="10" rx="3"/></g>
        <g transform="rotate(-18 292 249)"><rect class="dent" x="284" y="241" width="15" height="13" rx="4"/><rect class="dent-in" x="285.6" y="242.6" width="12" height="10" rx="3"/></g>
        <g transform="rotate(-10 310 250)"><rect class="dent" x="302" y="242" width="15" height="13" rx="4"/><rect class="dent-in" x="303.6" y="243.6" width="12" height="10" rx="3"/></g>
        <g transform="rotate(-4 330 255)"><rect class="dent" x="322" y="247" width="13" height="11" rx="4"/><rect class="dent-in" x="323.6" y="248.6" width="10" height="8" rx="3"/></g>
      </g>
    </g>
    <!-- 被压扁后翘起的两根毛（在轮廓上） -->
    <path id="imprint-tuft" class="tuft" style="display:none"/>
    <!-- 累了 / 生气：眉毛下压（黑斑上那条用浅色） -->
    <g id="brows" style="display:none" data-part="brows"></g>
    <path id="sweat" class="sweat" style="display:none"/>
    <!-- 叹气：从嘴角出来（坐标由 fatigue.js 每帧设置） -->
    <g id="sigh" style="display:none">
      <circle id="sigh-a" class="sigh" cx="406" cy="234" r="6"/>
      <circle id="sigh-b" class="sigh" cx="414" cy="232" r="4.5"/>
      <circle id="sigh-c" class="sigh" cx="410" cy="240" r="4"/>
    </g>
    <!-- 漫画式怒气符号 -->
    <g id="anger" style="display:none" transform="translate(478 96)">
      <path class="anger-under" d="M -15 -4 Q -6 -6 -4 -15 M 4 -15 Q 6 -6 15 -4 M 15 4 Q 6 6 4 15 M -4 15 Q -6 6 -15 4"/>
      <path class="anger" d="M -15 -4 Q -6 -6 -4 -15 M 4 -15 Q 6 -6 15 -4 M 15 4 Q 6 6 4 15 M -4 15 Q -6 6 -15 4"/>
    </g>
  </g>

  <!-- 罢工：同一只猫转过去的正背面。轮廓、位置、大小和正面坐姿完全一样，只是没有脸：
       头和身体复用正面的路径；花色左右镜像（头上的黑斑在观众右侧，身上的黑斑在观众左侧）；
       耳朵纯黑、向两侧压低成飞机耳。 -->
  <g id="cat-strike" style="display:none">
    <g id="strike-sign" transform="rotate(-5 165 300)">
      <rect class="sign-post" x="159" y="246" width="12" height="130" rx="4"/>
      <rect class="sign-board" x="96" y="196" width="134" height="58" rx="10"/>
      <text class="sign-text" x="163" y="235">罢工中</text>
    </g>
    <!-- strike-body：背影的身体，按每只猫的体型静态缩放（coats.js），和正面身体一致 -->
    <g id="strike-body">
      <path class="coat-base"/>
      <g id="coat-back-body-patterns" clip-path="url(#clip-back-body)">
        <path class="coat-cow-marking" d="M 334 284 C 304 286, 284 318, 284 354 C 284 380, 298 396, 316 392 C 334 388, 330 364, 336 346 C 342 326, 352 310, 348 296 C 346 288, 340 284, 334 284 Z"/>
      </g>
      <path class="ink-line" fill="none"/>
    </g>
    <!-- 尾巴从身体底部伸出，贴着桌面甩向观众右侧，一下一下拍桌面 -->
    <g id="strike-tail">
      <path class="tail-outline"/>
      <path class="tail-fill"/>
      <!-- 环纹：虚线描边，dasharray 由 coats.js 按每只猫的 tail.rings 算（pathLength=100，从尾根量起） -->
      <path id="strike-tail-rings" class="strike-tail-rings" pathLength="100"/>
      <path class="tail-tip" pathLength="100"/>
    </g>
    <g id="strike-head"><g id="strike-head-shape">
      <g class="ear-shape-l"><g id="strike-ear-l" transform="rotate(-12 322 110)" data-part="back-ear-l"></g></g>
      <g class="ear-shape-r"><g id="strike-ear-r" transform="rotate(12 478 110)" data-part="back-ear-r"></g></g>
      <g id="back-head-rear-accessories"></g>
      <path class="coat-base" d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/>
      <g id="coat-back-head-patterns" clip-path="url(#clip-back-head)">
        <path class="coat-cow-marking" d="M 250 40 H 550 V 236 C 516 240, 484 222, 466 192 C 448 160, 436 128, 396 116 C 352 104, 300 108, 250 122 Z"/>
      </g>
      <path class="ink-line" fill="none" d="M 270 176 C 268 98, 328 70, 400 70 C 472 70, 532 98, 530 176 C 529 240, 476 276, 400 276 C 324 276, 271 240, 270 176 Z"/>
    </g></g>
  </g>

  <g id="zzz">
    <text id="z1" class="z" style="display:none">Z</text>
    <text id="z2" class="z" style="display:none">Z</text>
    <text id="z3" class="z" style="display:none">Z</text>
  </g>

  <g id="keyboard"></g>

  <!-- 鼠标：朝向猫（掌托靠猫，按键朝观众；猫视角的左键在观众右边） -->
  <g id="mouse" transform="translate(104 484)">
    <ellipse class="shadow" cx="2" cy="48" rx="36" ry="8"/>
    <g id="mouse-shell" transform="rotate(180)">
      <rect class="mouse-body" x="-28" y="-42" width="56" height="84" rx="28"/>
      <path id="mouse-btn-l" class="mouse-btn" d="M -28 -14 A 28 28 0 0 1 0 -42 L 0 -4 L -28 -4 Z"/>
      <path id="mouse-btn-r" class="mouse-btn" d="M 0 -42 A 28 28 0 0 1 28 -14 L 28 -4 L 0 -4 Z"/>
      <rect id="mouse-wheel" class="mouse-wheel" x="-4" y="-32" width="8" height="15" rx="4"/>
      <rect class="mouse-ring" x="-28" y="-42" width="56" height="84" rx="28"/>
    </g>
    <!-- 修好后鼠标上的创可贴 -->
    <g id="mouse-bandage" style="display:none" transform="translate(4 6) rotate(-32)">
      <rect class="bandage" x="-20" y="-7" width="40" height="14" rx="7"/>
      <rect class="bandage-pad" x="-7" y="-5.5" width="14" height="11" rx="2.5"/>
      <circle class="bandage-dot" cx="-13" cy="-2.2" r="1.2"/><circle class="bandage-dot" cx="-13" cy="2.2" r="1.2"/>
      <circle class="bandage-dot" cx="13" cy="-2.2" r="1.2"/><circle class="bandage-dot" cx="13" cy="2.2" r="1.2"/>
    </g>
  </g>

  <!-- 尾巴绕到前面的那一段：画在键盘和鼠标上面、手臂下面；和 #tail 是同一条轮廓，遮罩掉身体那块 -->
  <g id="tail-front" style="display:none" mask="url(#mask-tail-front)">
    <path id="tail-front-body" class="tail-body" d=""/>
    <path id="tail-front-rings" class="tail-ring" d=""/>
    <path id="tail-front-tip" class="tail-tip-fill" d=""/>
  </g>

  <!-- 口水滴和键盘上的水渍 -->
  <g id="drool-layer" pointer-events="none">
    <g id="puddle" style="display:none">
      <ellipse id="puddle-pool" class="puddle" cx="400" cy="398" rx="10" ry="3"/>
      <ellipse id="puddle-shine" class="puddle-shine" cx="398" cy="397" rx="3" ry="1"/>
    </g>
    <g id="drops"></g>
  </g>

  <!-- 手臂和爪子：按画面左右命名，观众左侧黑（猫的右爪），观众右侧白（猫的左爪） -->
  <g id="arm-l">
    <path id="arm-l-outline" class="arm-outline" d="M 338 318 L 332 470"/>
    <path id="arm-l-fill" class="arm-fill-l" d="M 338 318 L 332 470"/>
    <path id="arm-l-stripes" class="arm-stripes" d="M 338 318 L 332 470"/>
  </g>
  <g id="arm-r">
    <path id="arm-r-outline" class="arm-outline" d="M 462 318 L 452 470"/>
    <path id="arm-r-fill" class="arm-fill-r" d="M 462 318 L 452 470"/>
    <path id="arm-r-stripes" class="arm-stripes" d="M 462 318 L 452 470"/>
  </g>
  <g id="paw-l" transform="translate(332 478)" data-part="paw-l"></g>
  <g id="paw-r" transform="translate(452 478)" data-part="paw-r"></g>
  <!-- 发飙时飞散的键帽、罢工时的"哼" -->
  <g id="debris-layer" pointer-events="none"></g>
  <g id="bubble-layer" pointer-events="none"></g>
  <!-- 浮起的键名：在猫和键盘之上，正着显示给观众，不接收指针 -->
  <g id="fx-layer" pointer-events="none"></g>
</svg>
</main>

<footer id="controls">
  <label class="ctl">换只猫 <select id="cat-select"></select></label>
  <label class="ctl">入睡时间
    <input id="sleep-range" type="range" min="5" max="120" step="1" value="20">
    <span id="sleep-label">20 秒</span>
  </label>
  <label class="ctl"><input id="mouse-left" type="checkbox"> 鼠标换到猫的左手边</label>
  <label class="ctl"><input id="hide-keyboard" type="checkbox"> 隐藏键盘（检查身体）</label>
  <label class="ctl">连续打字多久会生气
    <input id="work-range" type="range" min="15" max="3600" step="5" value="90">
    <span id="work-label">90 秒</span>
  </label>
  <label class="ctl">休息多久消气
    <input id="rest-range" type="range" min="5" max="600" step="1" value="20">
    <span id="rest-label">20 秒</span>
  </label>
  <span class="ctl">疲劳 <span class="fatigue-track"><span id="fatigue-bar" data-mood="fine"></span></span></span>
  <span class="ctl status">状态：<b id="status">awake</b></span>
  <span id="rest-hint" class="ctl rest-hint" style="display:none"></span>
</footer>

<template id="parts-cat">
  <svg>
    <g data-part="ear-l">
      <path class="coat-ear ink" d="M 286 128 L 290 44 Q 293 30 306 37 L 362 84 L 380 150 L 300 160 Z"/>
      <path class="coat-inner-ear" d="M 302 108 L 304 58 L 341 86 Z"/>
    </g>
    <g data-part="back-ear-l">
      <path class="coat-ear ink" d="M 286 128 L 290 44 Q 293 30 306 37 L 362 84 Z"/>
    </g>
    <g data-part="paw-l">
      <ellipse class="coat-paw-l ink" cx="0" cy="0" rx="21" ry="15"/>
      <path class="toe-l" d="M -7 5 L -7 12 M 7 5 L 7 12"/>
    </g>
    <g data-part="ear-r">
      <path class="coat-ear ink" d="M 514 128 L 510 44 Q 507 30 494 37 L 438 84 L 420 150 L 500 160 Z"/>
      <path class="coat-inner-ear" d="M 498 108 L 496 58 L 459 86 Z"/>
    </g>
    <g data-part="back-ear-r">

<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  SillySpecies.select('cat');
  const desktopMode = SillyDesktopInput.isDesktop();
  // 桌面版调试模式：设置窗口（连点 10 次检查更新开启）发 silly:debug-demo 过来，
  // 主窗口带 ?demo= 参数重载进入对应状态（复用网页版调试面板的 URL 参数机制）
  if (desktopMode && window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('silly:debug-demo', (ev) => {
      const spec = ev.payload && ev.payload.spec;
      const p = new URLSearchParams(location.search);
      if (spec && spec.startsWith('__')) { // 「__xxx」开关：只切对应参数，demo 保持不变
        const key = spec.slice(2);
        if (p.has(key)) p.delete(key); else p.set(key, '1');
      } else if (spec) {
        const [name, ...extra] = spec.split('&');
        p.set('demo', name);
        p.set('loop', '1');
        for (const kv of extra) {
          const eq = kv.indexOf('=');
          p.set(eq === -1 ? kv : kv.slice(0, eq), eq === -1 ? '1' : kv.slice(eq + 1));
        }
      } else {
        for (const k of ['demo', 'loop', 'at', 'doze', 'nolimbs', 'nokeys']) p.delete(k);
      }
      location.href = location.pathname + '?' + p.toString();
    }).catch(() => {});
  }
  // 耳机颜色：headphoneColor = 'random' 时每次戴上随机挑一个，戴着期间不变（摘了下次戴再随机）。
  // 当前生效颜色记在 hpColor 里；设置换成固定色时立即生效，换成随机时保留当前色到下次戴上。
  let hpColor = 'strawberry';
  const HP_KEYS = Object.keys(SillySettings.HEADPHONE_COLORS);
  const pickHpColor = () => HP_KEYS[Math.floor(Math.random() * HP_KEYS.length)];
  const sceneEl = document.getElementById('scene');
  // 调试：?nolimbs=1 藏手臂前爪后脚、?nokeys=1 藏键盘（网页调试面板/客户端调试栏的开关按钮）
  const bootParams = new URLSearchParams(location.search);
  for (const key of ['nolimbs', 'nokeys']) if (bootParams.has(key)) sceneEl.classList.add(key);
  const applyHpColor = (value) => {
    hpColor = SillySettings.normalizeHeadphoneColor(value);
    sceneEl.setAttribute('data-hp-color', hpColor === SillySettings.HP_RANDOM ? pickHpColor() : hpColor);
  };
  // 戴上耳机的三个入口（游戏模式 / 空闲听歌 / 用户听歌）都会调用：随机模式下换一个颜色
  // set：设置变化时重新应用（桌面版 applySettings 调用；也方便调试）
  window.SillyHeadphoneColor = { onWear() { if (hpColor === SillySettings.HP_RANDOM) sceneEl.setAttribute('data-hp-color', pickHpColor()); }, set: applyHpColor };
  if (!desktopMode) {
    const catSelect = document.getElementById('cat-select');
    for (const { id, name } of SillyCoats.list()) catSelect.add(new Option(name, id));
    catSelect.value = SillyCoats.setArtStyle(params.get('style'), params.get('cat')).id;
    // 保留原生下拉框的按键操作，避免被页面的全局键盘监听截走。
    catSelect.addEventListener('keydown', (event) => event.stopPropagation());
    catSelect.addEventListener('change', () => {
      SillyCoats.apply(catSelect.value);
      catSelect.blur();
    });
  }
  const num = (k) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) && v > 0 ? v : null; };
  // URL 参数可以超出滑块范围（方便快速验收），滑块只显示夹到范围内的位置
  const sleep = num('sleep') ?? 20;
  const work = num('work') ?? 90;
  const rest = num('rest') ?? 20;
  // 调试入口：?demo=阶段 直接摆到并停在某个阶段；&loop=1 循环播放；&at=毫秒 冻结在时间轴上的某一刻
  const demo = params.get('demo') ? { name: params.get('demo'), loop: params.get('loop') === '1', at: num('at') ?? (params.get('at') === '0' ? 0 : NaN), miss: params.get('miss') === '1', cheer: params.get('cheer') === '1', buddy: params.get('buddy') === '1', fat: params.get('fat') === '1', hunt: params.get('hunt') === '1', doze: params.get('doze') === '1' } : null;

  // 趴下方式：默认每次随机；?slump-style=nod|melt 强制指定（调试用）
  const slumpStyle = params.get('slump-style');

  // 状态条：默认显示；?statusbar=0 关掉（网页版没有设置窗口）
  const toggle = (key) => params.has(key) ? !/^(0|false|off|no)$/i.test(params.get(key)) : null;
  const statusBarParam = toggle('statusbar'), pushParam = toggle('push'), eyesParam = toggle('eyes');
  const soundsParam = toggle('sounds'), grumpParam = toggle('grump'), swatParam = toggle('swat'), purrParam = toggle('purr');
  const pushEveryParam = parseFloat(params.get('pushevery'));

  const keyboardParam = params.get('kb');
  const kb = SillyKeyboard.build(document.getElementById('keyboard'), keyboardParam ?? SillySettings.DEFAULTS.keyboard);
  function updateGroundShadow() {
    const shadow = document.getElementById('ground-shadow');
    const full = kb.style === 'full';
    shadow.setAttribute('cy', full ? 560 : 594);
    shadow.setAttribute('rx', full ? 310 : 300);
    shadow.setAttribute('ry', full ? 18 : 20);
  }
  updateGroundShadow();

  let fatigue = null, sleepMod = null, push = null, statusBar = null, pomo = null, holiday = null, quip = null, sit = null, visitor = null, tailSlapMod = null, kbdFlowMod = null, headTurnMod = null, hindPawsMod = null, listenMod = null, userMusicMod = null, grumpMod = null, swatMod = null, purrMod = null;
  const cat = SillyCat.createCat({
    keyboard: kb, sleepSeconds: sleep, eyesFollow: eyesParam ?? SillySettings.DEFAULTS.eyesFollow, demo,
    modules: [
      (ctx) => window.SillySounds.create(ctx), // 第一个注册：借输入事件解锁音频
      (ctx) => (sleepMod = SillySleep.create(ctx, { droolSeconds: num('drool') ?? NaN, slumpSeconds: num('slump') ?? NaN, slumpStyle, demo })),
      (ctx) => (fatigue = SillyFatigue.create(ctx, { workSeconds: work, restSeconds: rest, demo })),
      (ctx) => SillyPounce.create(ctx, { demo }),
      (ctx) => (push = SillyPush.create(ctx, {
        enabled: pushParam ?? true, everySeconds: pushEveryParam, demo,
        blocked: () => grumpMod?.active?.() || swatMod?.isActing?.(performance.now()),
        canSnatch() {
          const { fatigue: value, phase } = fatigue.statusInfo();
          return !phase && value < 0.6;
        },
      })),
      (ctx) => (grumpMod = SillyGrump.create(ctx, { fatigue, enabled: grumpParam ?? SillySettings.DEFAULTS.grump, demo, isPushing: (now) => push.isActing(now) })),
      (ctx) => (swatMod = SillySwat.create(ctx, { enabled: swatParam ?? SillySettings.DEFAULTS.swat, demo, anger: () => grumpMod.anger(), isPushing: (now) => push.isActing(now) })),
      (ctx) => (purrMod = SillyPurr.create(ctx, { enabled: purrParam ?? SillySettings.DEFAULTS.purr, volume: SillySettings.DEFAULTS.purrVolume, canPurr: () => grumpMod.canPurr() })),
      (ctx) => SillyIdleGestures.create(ctx, { demo }),
      (ctx) => SillyEasterWords.create(ctx, { demo }),
      (ctx) => SillyTypeRhythm.create(ctx, { demo }),
      (ctx) => SillyDreams.create(ctx, { demo }),
      (ctx) => SillyQuotes.create(ctx, { demo }),
      (ctx) => (quip = SillyQuips.create(ctx, { demo })),
      (ctx) => SillyPoke.create(ctx, { demo }),
      (ctx) => SillyPullTail.create(ctx, { demo, fatigue }),
      (ctx) => SillyCoffee.create(ctx, { demo, push, fatigue }),
      (ctx) => SillyMeal.create(ctx, { demo }),
      (ctx) => SillyIcons.create(ctx, { demo }),
      (ctx) => SillyZoomies.create(ctx, { demo }),
      (ctx) => SillyShed.create(ctx, { demo, sleep: sleepMod }),
      (ctx) => window.SillyStats.create(ctx),
      (ctx) => SillyAffection.create(ctx, { demo }),
      (ctx) => SillyWand.create(ctx, { demo }),
      (ctx) => SillyLaser.create(ctx, { demo }),
      (ctx) => SillySnack.create(ctx, { demo }),
      (ctx) => (sit = SillySitRemind.create(ctx, { demo })),
      (ctx) => SillyWater.create(ctx, { demo }),
      (ctx) => (pomo = SillyPomodoro.create(ctx, { demo })),
      (ctx) => (holiday = SillyHolidays.create(ctx, { demo })),
      (ctx) => SillyBossKey.create(ctx, { demo }),
      (ctx) => SillyGrowth.create(ctx, { demo }),
      (ctx) => SillySnapshot.create(ctx, { demo }),
      (ctx) => (visitor = SillyVisitor.create(ctx, { demo })),
      (ctx) => (tailSlapMod = SillyTailSlap.create(ctx, { demo })),
      (ctx) => SillyKeyEggs.create(ctx, { demo, tailslap: () => tailSlapMod }),
      (ctx) => (kbdFlowMod = SillyKbdFlow.create(ctx, { demo })),
      (ctx) => (headTurnMod = SillyHeadTurn.create(ctx, { demo })),
      (ctx) => SillyGameModeEgg.create(ctx, { demo }),
      (ctx) => SillyPrivacyMode.create(ctx, { demo }),
      (ctx) => (hindPawsMod = SillyHindPaws.create(ctx, { demo })),
      (ctx) => (listenMod = SillyListenMusic.create(ctx, { demo })),
      (ctx) => (userMusicMod = SillyUserMusic.create(ctx)),
      (ctx) => (statusBar = SillyStatusBar.create(ctx, { fatigue, grump: grumpMod, enabled: statusBarParam ?? true })),
      SillyCoats.shapeModule,
    ],
  });
  const headEl = [document.getElementById('cat-head'), document.getElementById('strike-head')];
  // 狗狗叼走鼠标后：点它身上任意部位把鼠标要回来
  function retrieveTarget(target) {
    if (!push.canRetrieve()) return null;
    return target?.closest?.('#cat-body, #arm-l, #arm-r, #paw-l, #paw-r, #tail, #snatch-back') || null;
  }
  if (desktopMode) {
    // 桌面外壳：全局键鼠代替页面内的键鼠事件（不同时挂两份，避免一次按键算两次）
    const desktop = SillyDesktopInput.create(cat, { headEl, retrieveTarget, sceneEl: document.getElementById('scene') });
    Object.defineProperty(window, '__desktop', { value: desktop.debug, writable: false, configurable: false });

    // 启动时读 settings.json 再显示，之后每次保存都会发 silly:settings 事件过来，立即生效。
    // 品种和画风只读设置。其他支持 URL 的字段在启动时优先用 URL 参数，之后以设置窗口为准。
    const applySettings = (raw, skipUrl) => {
      const s = SillySettings.sanitize(raw);
      // 窗口外层缩放（settings.size 由 Tauri 窗口层 set_size 实现）会把 scene 里所有元素一起缩。
      // 把 size 暴露给模块，让番茄钟等小部件做逆缩放保持固定视觉大小。
      window.__catSize = s.size || 1;
      SillyCoats.setArtStyle(s.artStyle, s.cat);
      if (!(skipUrl && SillyKeyboard.isStyle(keyboardParam))) cat.setKeyboardStyle(s.keyboard);
      const use = (k) => !(skipUrl && num(k) !== null);
      if (use('sleep')) cat.setSleepSeconds(s.sleep);
      if (use('drool')) sleepMod.setDroolSeconds(s.drool ?? NaN); // NaN = 自动（入睡时间 × 2）
      if (use('slump')) sleepMod.setSlumpSeconds(s.slump ?? NaN); // NaN = 自动（入睡时间 × 3.5）
      if (use('work')) fatigue.setWorkSeconds(s.work);
      if (use('rest')) fatigue.setRestSeconds(s.rest);
      if (!(skipUrl && statusBarParam !== null)) statusBar.setEnabled(s.statusBar);
      if (!(skipUrl && pushParam !== null)) push.setEnabled(s.push);
      if (!(skipUrl && soundsParam !== null)) window.SillySounds.setEnabled(s.sounds);
      if (pomo) { pomo.setEnabled(s.pomo); pomo.setCheer(s.pomoCheer); }
      if (holiday) { holiday.setBirthday(s.birthday); holiday.setBirthdayHearts(s.birthdayHearts); }
      if (quip) quip.setEnabled(s.quips);
      if (sit) sit.setEnabled(s.sitRemind, s.sitMinutes);
      if (visitor) visitor.setRandomCoat(s.kittenCoat);
      if (tailSlapMod) tailSlapMod.setEnabled(s.tailSlap);
      if (kbdFlowMod) kbdFlowMod.setEnabled(s.kbdFlow);
      if (headTurnMod) headTurnMod.setEnabled(s.headTurn);
      if (hindPawsMod) hindPawsMod.setEnabled(s.hindPaws);
      if (listenMod) listenMod.setEnabled(s.listenMusic);
      if (userMusicMod) userMusicMod.setEnabled(s.userMusic);
      applyHpColor(s.headphoneColor);
      if (grumpMod) grumpMod.setEnabled(s.grump);
      if (swatMod) swatMod.setEnabled(s.swat);
      if (purrMod) { purrMod.setEnabled(s.purr); purrMod.setVolume(s.purrVolume); }
      if (!(skipUrl && eyesParam !== null)) cat.setEyesFollow(s.eyesFollow);
      if (!(skipUrl && Number.isFinite(pushEveryParam))) push.setEverySeconds(s.pushEvery);
    };
    const T = window.__TAURI__;
    let settingsChanged = false;
    T.event.listen('silly:settings', (ev) => {
      settingsChanged = true;
      applySettings(ev.payload, false);
    })
      .catch((error) => console.warn('订阅桌宠设置失败', error))
      .then(() => T.core.invoke('load_settings'))
      .catch(() => null)
      .then((raw) => {
        if (settingsChanged) return;
        if (raw) applySettings(raw, true);
        else SillyCoats.apply('cow');
      });
  } else {
    SillyInput.createBrowserInput(cat, {
      headEl,
      retrieveTarget,
      ignoreEl: document.getElementById('controls'),
      stageEl: document.getElementById('stage'),
    });
  }
  Object.defineProperty(window, '__cat', { value: cat.debug, writable: false, configurable: false });

  const range = document.getElementById('sleep-range');
  const label = document.getElementById('sleep-label');
  range.value = String(sleep);
  label.textContent = sleep + ' 秒';
  range.addEventListener('input', () => {
    cat.setSleepSeconds(+range.value);
    label.textContent = range.value + ' 秒';
  });
  range.addEventListener('change', () => range.blur());

  function bindRange(id, labelId, value, apply) {
    const r = document.getElementById(id), l = document.getElementById(labelId);
    r.value = String(value);
    l.textContent = value + ' 秒';
    r.addEventListener('input', () => { apply(+r.value); l.textContent = r.value + ' 秒'; });
    r.addEventListener('change', () => r.blur());
  }
  bindRange('work-range', 'work-label', work, (v) => fatigue.setWorkSeconds(v));
  bindRange('rest-range', 'rest-label', rest, (v) => fatigue.setRestSeconds(v));

  const left = document.getElementById('mouse-left');
  left.addEventListener('change', () => {
    cat.setMouseSide(left.checked ? 'left' : 'right');
    left.blur();
  });

  // 隐藏键盘：只在网页版调试面板里有，方便看猫的身体（后腿、肚子、尾巴根这些被键盘挡住的部位）
  const hideKb = document.getElementById('hide-keyboard');
  hideKb.addEventListener('change', () => {
    document.getElementById('keyboard').style.display = hideKb.checked ? 'none' : '';
    hideKb.blur();
  });

  const status = document.getElementById('status');
  setInterval(() => {
    const c = __cat;
    const stageName = { sitting: '坐着睡', drool: '流口水', slumped: '趴着睡' }[c.sleepStage];
    const moodName = { fine: '', tired: '累了', angry: '生气' }[c.mood];
    status.textContent = [c.state, stageName, moodName, c.excited ? '兴奋' : ''].filter(Boolean).join(' · ');
  }, 200);
})();
</script>
